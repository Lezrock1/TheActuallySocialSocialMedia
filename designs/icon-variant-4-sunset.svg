<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#fb7185"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <filter id="softGlow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#1c0a0a"/>
  <ellipse cx="200" cy="230" rx="110" ry="110" fill="url(#warmGradient)" opacity="0.9"/>
  <ellipse cx="312" cy="280" rx="110" ry="110" fill="url(#warmGradient)" opacity="0.7"/>
  <circle cx="256" cy="256" r="28" fill="#fff7ed" filter="url(#softGlow4)"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>
  <ellipse cx="180" cy="180" rx="40" ry="30" fill="#ffffff" opacity="0.12" transform="rotate(-30 180 180)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e662f5"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="512" height="256" fill="url(#gloss)"/>
    <g fill="none" stroke="#fff">
      <circle cx="256" cy="256" r="236" stroke-width="14" opacity="0.14"/>
      <circle cx="256" cy="256" r="184" stroke-width="16" opacity="0.28"/>
      <circle cx="256" cy="256" r="132" stroke-width="18" opacity="0.5"/>
      <circle cx="256" cy="256" r="80" stroke-width="20" opacity="0.85"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="52" fill="#fff" opacity="0.6" filter="url(#blur)"/>
  <circle cx="256" cy="256" r="34" fill="url(#dot)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e662f5"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="a" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#fbd0fb" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f08af0" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="b" cx="35%" cy="22%" r="95%">
      <stop offset="0" stop-color="#fde7ff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f3a6f5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d36bf0" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f7b6f7" stop-opacity="0.8"/>
    </radialGradient>
    <clipPath id="clipA"><ellipse cx="200" cy="205" rx="138" ry="122" transform="rotate(-18 200 205)"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="256" rx="112" fill="url(#gloss)"/>
  <ellipse cx="270" cy="432" rx="170" ry="20" fill="#4a044e" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="200" cy="205" rx="138" ry="122" transform="rotate(-18 200 205)" fill="url(#a)"/>
  <circle cx="322" cy="318" r="125" fill="url(#b)"/>
  <g clip-path="url(#clipA)">
    <circle cx="322" cy="318" r="125" fill="url(#lens)"/>
    <circle cx="322" cy="318" r="124" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="3"/>
  </g>
  <circle cx="262" cy="262" r="50" fill="#d946ef" opacity="0.55" filter="url(#blur)"/>
  <circle cx="262" cy="262" r="30" fill="#fff"/>
</svg>

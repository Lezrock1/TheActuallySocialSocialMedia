<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede4ff"/>
    </radialGradient>
    <radialGradient id="a" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#f5d0fe"/>
      <stop offset="0.3" stop-color="#d946ef"/>
      <stop offset="0.7" stop-color="#8b2cf0"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </radialGradient>
    <radialGradient id="b" cx="35%" cy="22%" r="95%">
      <stop offset="0" stop-color="#c4b5fd"/>

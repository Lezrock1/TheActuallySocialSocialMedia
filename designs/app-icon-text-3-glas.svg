<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="blob" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4c1d95" flood-opacity="0.35"/></filter>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="110" cy="420" r="120" fill="#fb7185" opacity="0.7" filter="url(#blob)"/>
    <circle cx="420" cy="90" r="110" fill="#fde047" opacity="0.55" filter="url(#blob)"/>
    <circle cx="400" cy="440" r="100" fill="#22d3ee" opacity="0.55" filter="url(#blob)"/>
  </g>
  <g>
    <rect x="64" y="84" width="214" height="152" rx="54" fill="url(#glassA)" stroke="url(#glassRim)" stroke-width="4"/>
    <path d="M98 228L72 292L152 236Z" fill="#fff" fill-opacity="0.38"/>
  </g>
  <g>
    <rect x="150" y="224" width="300" height="158" rx="54" fill="url(#glassA)" stroke="url(#glassRim)" stroke-width="4"/>
    <path d="M394 376L422 440L334 380Z" fill="#fff" fill-opacity="0.38"/>
  </g>
  <g font-family="'Avenir Next','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#fff" filter="url(#textShadow)">
    <text x="171" y="162" font-size="116" textLength="108" lengthAdjust="spacingAndGlyphs">in</text>
    <text x="300" y="304" font-size="92" textLength="240" lengthAdjust="spacingAndGlyphs">touch</text>

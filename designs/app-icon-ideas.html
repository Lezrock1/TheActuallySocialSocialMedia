<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>InTouch App-Icon Ideen</title>
<style>
  body { font-family: -apple-system, "SF Pro Text", sans-serif; margin: 32px; background: #f3f4f6; color: #111827; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  figure { margin: 0; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgb(15 23 42 / 8%); }
  figure > img { width: 220px; height: 220px; display: block; margin: 0 auto 16px; }
  .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .sizes img { display: block; }
  figcaption h2 { font-size: 15px; margin: 0 0 4px; }
  figcaption p { font-size: 13px; line-height: 1.45; color: #4b5563; margin: 0; }
  .dark { background: #111318; border-radius: 14px; padding: 12px; margin-bottom: 14px; display: flex; justify-content: center; gap: 12px; }
</style>
</head>
<body>
<h1>InTouch – 5 App-Icon-Ideen</h1>
<div class="grid">
  <figure>
    <img src="app-icon-idea-1-in-monogram.svg" alt="">
    <div class="sizes"><img src="app-icon-idea-1-in-monogram.svg" width="60" alt=""><img src="app-icon-idea-1-in-monogram.svg" width="40" alt=""><img src="app-icon-idea-1-in-monogram.svg" width="29" alt=""></div>
    <figcaption><h2>1 · „in"-Monogramm</h2><p>Der Markenname als weiche Buchstaben, der i-Punkt ist der gelbe „Touch"-Funke. Sonnenuntergangs-Verlauf von Magenta zu Orange. Sehr klar, auch winzig lesbar.</p></figcaption>
  </figure>
  <figure>
    <img src="app-icon-idea-2-bubble-lens.svg" alt="">
    <div class="sizes"><img src="app-icon-idea-2-bubble-lens.svg" width="60" alt=""><img src="app-icon-idea-2-bubble-lens.svg" width="40" alt=""><img src="app-icon-idea-2-bubble-lens.svg" width="29" alt=""></div>
    <figcaption><h2>2 · Sprechblase + Linse</h2><p>Eine Chat-Blase mit einer Kameralinse darin: Chats und Snaps in einem Zeichen. Dunkler Hintergrund, leuchtende Blase.</p></figcaption>
  </figure>
  <figure>
    <img src="app-icon-idea-3-touching-fingers.svg" alt="">
    <div class="sizes"><img src="app-icon-idea-3-touching-fingers.svg" width="60" alt=""><img src="app-icon-idea-3-touching-fingers.svg" width="40" alt=""><img src="app-icon-idea-3-touching-fingers.svg" width="29" alt=""></div>
    <figcaption><h2>3 · Fast berührende Finger</h2><p>Zwei abgerundete Finger, zwischen denen der Funke überspringt – wörtlich „in touch". Frisches Blau-Violett, hebt sich von typischen Messenger-Grüntönen ab.</p></figcaption>
  </figure>
  <figure>
    <img src="app-icon-idea-4-circle-of-friends.svg" alt="">
    <div class="sizes"><img src="app-icon-idea-4-circle-of-friends.svg" width="60" alt=""><img src="app-icon-idea-4-circle-of-friends.svg" width="40" alt=""><img src="app-icon-idea-4-circle-of-friends.svg" width="29" alt=""></div>
    <figcaption><h2>4 · Freundeskreis</h2><p>Sechs bunte Punkte um dich in der Mitte, passend zu Circles und dem Regenbogen-Verlauf in der App. Dunkel und bunt, sofort als „Gruppe" erkennbar.</p></figcaption>
  </figure>
  <figure>
    <img src="app-icon-idea-5-moment-spark.svg" alt="">
    <div class="sizes"><img src="app-icon-idea-5-moment-spark.svg" width="60" alt=""><img src="app-icon-idea-5-moment-spark.svg" width="40" alt=""><img src="app-icon-idea-5-moment-spark.svg" width="29" alt=""></div>
    <figcaption><h2>5 · Moment-Funke</h2><p>Ein großer weißer Funke mit kleinem gelbem Begleiter: der gemeinsame Moment. Ruhig, modern, bleibt nah an der heutigen Magenta-Farbe.</p></figcaption>
  </figure>
</div>
</body>
</html>

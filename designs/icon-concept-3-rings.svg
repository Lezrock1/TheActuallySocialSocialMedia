<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ringGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="ringGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ringGradient3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#111318"/>

  <!-- Three overlapping incomplete circles (story rings) -->
  <!-- Ring 1: top-left, gap at bottom-right -->
  <path d="M 180 200 A 80 80 0 1 1 260 280" fill="none" stroke="url(#ringGradient1)" stroke-width="24" stroke-linecap="round"/>

  <!-- Ring 2: center, gap at top-left -->
  <path d="M 320 180 A 90 90 0 1 0 230 270" fill="none" stroke="url(#ringGradient2)" stroke-width="28" stroke-linecap="round"/>

  <!-- Ring 3: bottom-right, gap at top -->
  <path d="M 280 320 A 70 70 0 1 1 350 390" fill="none" stroke="url(#ringGradient3)" stroke-width="20" stroke-linecap="round"/>

  <!-- Small center dot -->
  <circle cx="256" cy="256" r="18" fill="#f0f0f5"/>
</svg>

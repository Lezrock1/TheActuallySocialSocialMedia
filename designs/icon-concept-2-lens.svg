<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e879f9"/>
      <stop offset="40%" style="stop-color:#d946ef"/>
      <stop offset="70%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </radialGradient>
    <radialGradient id="innerLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f5f5f7"/>
      <stop offset="100%" style="stop-color:#d1d1d6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#111318"/>

  <!-- Outer lens ring with glow -->
  <circle cx="256" cy="256" r="140" fill="url(#lensGlow)" filter="url(#glow)"/>

  <!-- Inner lens -->
  <circle cx="256" cy="256" r="100" fill="#111318"/>
  <circle cx="256" cy="256" r="90" fill="url(#innerLens)"/>

  <!-- Center aperture/shutter -->
  <circle cx="256" cy="256" r="45" fill="#111318"/>
  <circle cx="256" cy="256" r="35" fill="#2c2c2e"/>

  <!-- Subtle reflection -->
  <ellipse cx="220" cy="200" rx="35" ry="25" fill="#ffffff" opacity="0.2" transform="rotate(-25 220 200)"/>
</svg>

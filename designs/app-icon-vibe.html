<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>InTouch – Bubble-Vibe mit Foto und Text</title>
<style>
  body { font-family: -apple-system, "SF Pro Text", sans-serif; margin: 32px; background: #f3f4f6; color: #111827; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  figure { margin: 0; background: #fff; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 2px 12px rgb(15 23 42 / 8%); }
  figure > img { width: 200px; height: 200px; display: block; margin: 0 auto 14px; }
  .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin-bottom: 12px; }
  h2 { font-size: 14px; margin: 0; }
</style>
</head>
<body>
<h1>Bubble-Vibe mit Foto und Text</h1>
<div class="grid">
  <figure><img src="app-icon-vibe-1-bubble-foto-text.svg" alt=""><div class="sizes"><img src="app-icon-vibe-1-bubble-foto-text.svg" width="60" alt=""><img src="app-icon-vibe-1-bubble-foto-text.svg" width="40" alt=""><img src="app-icon-vibe-1-bubble-foto-text.svg" width="29" alt=""></div><h2>1 · Foto-Bubble + Text-Bubble</h2></figure>
  <figure><img src="app-icon-vibe-2-polaroid-bubble.svg" alt=""><div class="sizes"><img src="app-icon-vibe-2-polaroid-bubble.svg" width="60" alt=""><img src="app-icon-vibe-2-polaroid-bubble.svg" width="40" alt=""><img src="app-icon-vibe-2-polaroid-bubble.svg" width="29" alt=""></div><h2>2 · Polaroid + Bubble</h2></figure>
  <figure><img src="app-icon-vibe-3-foto-bubble.svg" alt=""><div class="sizes"><img src="app-icon-vibe-3-foto-bubble.svg" width="60" alt=""><img src="app-icon-vibe-3-foto-bubble.svg" width="40" alt=""><img src="app-icon-vibe-3-foto-bubble.svg" width="29" alt=""></div><h2>3 · Foto in der Bubble</h2></figure>
  <figure><img src="app-icon-vibe-4-snap-mit-text.svg" alt=""><div class="sizes"><img src="app-icon-vibe-4-snap-mit-text.svg" width="60" alt=""><img src="app-icon-vibe-4-snap-mit-text.svg" width="40" alt=""><img src="app-icon-vibe-4-snap-mit-text.svg" width="29" alt=""></div><h2>4 · Snap mit Text-Pille</h2></figure>
  <figure><img src="app-icon-vibe-5-story-ring-text.svg" alt=""><div class="sizes"><img src="app-icon-vibe-5-story-ring-text.svg" width="60" alt=""><img src="app-icon-vibe-5-story-ring-text.svg" width="40" alt=""><img src="app-icon-vibe-5-story-ring-text.svg" width="29" alt=""></div><h2>5 · Story-Ring + Text-Bubble</h2></figure>
</div>
</body>
</html>

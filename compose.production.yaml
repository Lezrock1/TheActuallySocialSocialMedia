services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -ip=0.0.0.0
    expose:
      - "8333"
    volumes:
      - storage_data:/data
    networks:
      - data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:?Set AI_KEY_ENCRYPTION_SECRET in .env.production}
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-https://intouchsocial.com}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-anonymous}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-anonymous}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - edge
      - data

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE: ${PUBLIC_API_URL:-https://api.intouchsocial.com}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  data: